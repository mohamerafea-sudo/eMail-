<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال الطلب عبر البريد الإلكتروني</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;padding:30px 15px}
.container{max-width:520px;margin:auto}
.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 10px}
.subtitle{text-align:center;color:#666;line-height:1.6;margin-bottom:25px}
label{display:block;font-weight:bold;margin-bottom:8px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;direction:ltr;margin-bottom:22px}
.email-button{display:block;width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;color:#fff;background:#d93025;font-size:17px;font-weight:bold;cursor:pointer;text-decoration:none;text-align:center}
.info{text-align:center;color:#777;font-size:13px;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>📧 إرسال الطلب</h1>
<div class="subtitle">أدخل اسم الطالب كما هو مكتوب في جواز السفر، ورقم الطلب كما في موقع المنحة، ثم اضغط لإرسال الإيميل.</div>

<label for="studentName">اسم الطالب كما في جواز السفر</label>
<input id="studentName" type="text" placeholder="MOHAMMEDRAFEA Z. N. ABUHASSIRA" autocomplete="name">

<label for="applicationNumber">رقم الطلب كما في موقع المنحة</label>
<input id="applicationNumber" type="text" placeholder="PSE-10275/25" autocomplete="off">

<a href="#" class="email-button" onclick="sendEmail(1);return false;">📩 إرسال الإيميل</a>

<div class="info">بعد الضغط، ستفتح رسالة البريد جاهزة. راجعها ثم اضغط «إرسال».</div>
</div>
</div>

<script>
const email1 = {
to: "ruemb@mofa-gov.ps,embassy@palestine.ru,safara.russia@mail.ru",
cc: "russiastudentsgaza@gmail.com",
subject: "استعجال طارئ وحاسم بشأن تجديد قبولات ودعوات طلاب منح روسيا الاتحادية (دفعات 2024 و2025) تفادياً لتعطيل إجراءات خروجهم",
body: `سعادة سفير دولة فلسطين لدى روسيا الاتحادية المحترم،
الأخوة في القسم القنصلي والملحقية الثقافية المحترمون،

تحية طيبة وبعد،
نتقدم إليكم بعظيم التقدير والامتنان لجهودكم المخلصة في متابعة قضايا أبنائكم الطلبة، ونرفع إليكم هذا الالتماس العاجل جداً في ظل تسارع الترتيبات الميدانية.

مع بدء مساعٍ حقيقية وتطمينات من الجانب الروسي بشأن استئناف جهود الإجلاء وتسهيل مغادرة الطلبة، نود إحاطتكم علماً بوجود عقبة جوهرية طارئة تُهدد بحرمان شريحة واسعة من الطلبة من المغادرة؛ وتتمثل في أن طلاب دفعات 2024 و2025 قد أُلغيت أو انتهت صلاحية قبولاتهم ودعواتهم الدراسية في السنة التحضيرية حكماً نتيجة لظروف الحصار والحرب والقوة القاهرة الخارجة تماماً عن إرادتهم.

إن النقطة الحرجة تكمن في أن القنصلية والجهات الروسية ترفض اتخاذ أي إجراءات ترتيبية لخروج أي طالب لا يحمل دعوة دراسية وقبولاً مفعلاً ومحدثاً، ما يعني استثناء هؤلاء الطلاب تلقائياً وضياع مستقبلهم الأكاديمي وحقهم في المنح التي حصلوا عليها بجدارتهم.

ورغم أننا تقدمنا سابقاً بطلب رسمي عبر سفارتكم الموقرة لمخاطبة كل من وزارة العلوم والتعليم العالي الروسية (Минобрнауки) والوكالة الفيدرالية للتعاون الدولي (Россотрудничество) لإعادة تفعيل المقاعد والدعوات، إلا أننا لم نتلقَّ رداً حتى اللحظة، والوقت الحالي بات دقيقاً وحاسماً للغاية مع استكمال إجراءات الإجلاء.

لذا، نلتمس من سعادتكم تدخلاً دبلوماسياً عاجلاً وتصنيف هذا الملف ضمن "الأولويات القصوى والطارئة" عبر:

- الضغط الدبلوماسي والاستعجال المباشر: إعادة طرح الملف بشكل فوري وطارئ مع كبار مسؤولي وزارة التعليم العالي وهيئة التعاون الدولي الروسية للبت في طلبات إعادة التفعيل العالقة واستصدار استثناء مراعاةً للظروف القاهرة.

إن مستقبل هؤلاء الطلبة مرهون بسرعة تحرككم وضغطكم على الجهات الروسية المختصة لإنهاء هذه المعضلة الإجرائية في أسرع وقت.

نرجو من سعادتكم التكرم بالنظر بعين الاهتمام والإنسانية إلى وضعنا، ومساعدتنا في عدم ضياع مستقبلنا الدراسي.

وتفضلوا بقبول أسمى آيات الاحترام والتقدير،

طلاب قطاع غزة الحاصلين على منح دراسية في الاتحاد الروسي.

نرجو توجيه كافة المعلومات والردود إلى بريدنا الإلكتروني الطلابي الموحد: russiastudentsgaza@gmail.com

ممثل الطلاب: سعيد العشي

التاريخ: 6 سبتمبر 2026

اسم الطالب: {{STUDENT_NAME}}
رقم الطلب: {{APPLICATION_NUMBER}}`
};

const emails = {1:email1};

function sendEmail(number){
    const studentName = document.getElementById("studentName").value.trim();
    const applicationNumber = document.getElementById("applicationNumber").value.trim();

    if(!studentName){
        alert("يرجى إدخال اسم الطالب كما هو في جواز السفر.");
        document.getElementById("studentName").focus();
        return;
    }

    if(!applicationNumber){
        alert("يرجى إدخال رقم الطلب كما في موقع المنحة.");
        document.getElementById("applicationNumber").focus();
        return;
    }

    const email = emails[number];
    const finalBody = email.body
        .replace(/{{STUDENT_NAME}}/g, studentName)
        .replace(/{{APPLICATION_NUMBER}}/g, applicationNumber);

    const mailto =
        "mailto:" + encodeURIComponent(email.to) +
        "?cc=" + encodeURIComponent(email.cc) +
        "&subject=" + encodeURIComponent(email.subject) +
        "&body=" + encodeURIComponent(finalBody);

    window.location.href = mailto;
}
</script>
</body>
</html>
